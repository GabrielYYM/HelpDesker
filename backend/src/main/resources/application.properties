spring.application.name=DeskHelper
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Servidor
server.port=${PORT:${SERVER_PORT:8080}}

# MongoDB Atlas
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:${MONGODB_NAME:deskhelper}}
spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cookies de sessao e CSRF
session.cookie.secure=${SESSION_COOKIE_SECURE:false}
session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
