spring.application.name=DeskHelper

# Servidor
server.port=${SERVER_PORT:8080}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/deskhelper}
spring.data.mongodb.database=${MONGODB_DATABASE:deskhelper}

# JWT
jwt.secret=${JWT_SECRET:deskhelper_super_secret_key_change_me_in_production_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
